openapi: 3.1.0
info:
  title: Poly Trend Research API
  description: Verified, resumable prediction-market investigations.
  version: 2.0.0
paths:
  /healthz:
    get:
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Healthz Healthz Get
  /mcp:
    post:
      summary: Mcp Adapter
      operationId: mcp_adapter_mcp_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Payload
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Mcp Adapter Mcp Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/investigations:
    post:
      summary: Create Investigation
      operationId: create_investigation_api_v1_investigations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investigation'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/investigations/{investigation_id}:
    get:
      summary: Get Investigation
      operationId: get_investigation_api_v1_investigations__investigation_id__get
      parameters:
      - name: investigation_id
        in: path
        required: true
        schema:
          type: string
          title: Investigation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investigation'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      summary: Patch Investigation
      operationId: patch_investigation_api_v1_investigations__investigation_id__patch
      parameters:
      - name: investigation_id
        in: path
        required: true
        schema:
          type: string
          title: Investigation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investigation'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/investigations/{investigation_id}/runs:
    post:
      summary: Create Run
      operationId: create_run_api_v1_investigations__investigation_id__runs_post
      parameters:
      - name: investigation_id
        in: path
        required: true
        schema:
          type: string
          title: Investigation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchRun'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}:
    get:
      summary: Get Run
      operationId: get_run_api_v1_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchRun'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}/trace:
    get:
      summary: Get Run Trace
      operationId: get_run_trace_api_v1_runs__run_id__trace_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Run Trace Api V1 Runs  Run Id  Trace Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}/cancel:
    post:
      summary: Cancel Run
      operationId: cancel_run_api_v1_runs__run_id__cancel_post
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchRun'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}/events:
    get:
      summary: Stream Events
      operationId: stream_events_api_v1_runs__run_id__events_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}/fork:
    post:
      summary: Fork Run
      operationId: fork_run_api_v1_runs__run_id__fork_post
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkCreate'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchRun'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/markets/{market_id}:
    get:
      summary: Get Market
      operationId: get_market_api_v1_markets__market_id__get
      parameters:
      - name: market_id
        in: path
        required: true
        schema:
          type: string
          title: Market Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assets/{symbol}/snapshot:
    get:
      summary: Get Asset Snapshot
      operationId: get_asset_snapshot_api_v1_assets__symbol__snapshot_get
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/providers/health:
    get:
      summary: Provider Health
      operationId: provider_health_api_v1_providers_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Provider Health Api V1 Providers Health Get
components:
  schemas:
    AnswerKind:
      type: string
      enum:
      - market_implied
      - model_estimate
      - directional_assessment
      - insufficient
      title: AnswerKind
    AssetPricePoint:
      properties:
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        value:
          type: number
          exclusiveMinimum: 0.0
          title: Value
      type: object
      required:
      - timestamp
      - value
      title: AssetPricePoint
    AssetSnapshot:
      properties:
        symbol:
          type: string
          title: Symbol
        name:
          type: string
          title: Name
        currency:
          type: string
          title: Currency
          default: USD
        price:
          type: number
          exclusiveMinimum: 0.0
          title: Price
        as_of:
          type: string
          format: date-time
          title: As Of
        source:
          type: string
          title: Source
        source_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Url
        freshness:
          type: string
          title: Freshness
          default: live
        history:
          items:
            $ref: '#/components/schemas/AssetPricePoint'
          type: array
          title: History
      type: object
      required:
      - symbol
      - name
      - price
      - as_of
      - source
      title: AssetSnapshot
    CoverageState:
      type: string
      enum:
      - good
      - limited
      - insufficient
      title: CoverageState
    EvidenceGraph:
      properties:
        query_node:
          $ref: '#/components/schemas/EvidenceNode'
        nodes:
          items:
            $ref: '#/components/schemas/EvidenceNode'
          type: array
          title: Nodes
        edges:
          items:
            $ref: '#/components/schemas/RelationshipEdge'
          type: array
          title: Edges
      type: object
      required:
      - query_node
      title: EvidenceGraph
    EvidenceItem:
      properties:
        id:
          type: string
          title: Id
        kind:
          type: string
          title: Kind
        title:
          type: string
          title: Title
        source:
          type: string
          title: Source
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        published_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Published At
        summary:
          type: string
          title: Summary
          default: ''
        supports_numeric_answer:
          type: boolean
          title: Supports Numeric Answer
          default: false
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
        retrieved_at:
          type: string
          format: date-time
          title: Retrieved At
        freshness:
          type: string
          title: Freshness
          default: unknown
      type: object
      required:
      - kind
      - title
      - source
      title: EvidenceItem
    EvidenceNode:
      properties:
        id:
          type: string
          title: Id
        kind:
          type: string
          title: Kind
        label:
          type: string
          title: Label
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
        relevance:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Relevance
          default: 0.5
        included:
          type: boolean
          title: Included
          default: true
        evidence_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence Id
      type: object
      required:
      - id
      - kind
      - label
      title: EvidenceNode
    ForecastEstimate:
      properties:
        symbol:
          type: string
          title: Symbol
        condition:
          $ref: '#/components/schemas/TargetCondition'
        current_value:
          type: number
          exclusiveMinimum: 0.0
          title: Current Value
        target_value:
          type: number
          exclusiveMinimum: 0.0
          title: Target Value
        target_gap:
          type: number
          title: Target Gap
        deadline:
          type: string
          format: date-time
          title: Deadline
        days_remaining:
          type: number
          minimum: 0.0
          title: Days Remaining
        probability:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Probability
        probability_range:
          prefixItems:
          - type: number
          - type: number
          type: array
          maxItems: 2
          minItems: 2
          title: Probability Range
        verdict:
          type: string
          title: Verdict
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        realized_volatility_20d:
          type: number
          minimum: 0.0
          title: Realized Volatility 20D
        model_probabilities:
          additionalProperties:
            type: number
          type: object
          title: Model Probabilities
        paths:
          type: integer
          title: Paths
          default: 20000
        methodology:
          type: string
          title: Methodology
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
        as_of:
          type: string
          format: date-time
          title: As Of
      type: object
      required:
      - symbol
      - condition
      - current_value
      - target_value
      - target_gap
      - deadline
      - days_remaining
      - probability
      - probability_range
      - verdict
      - confidence
      - realized_volatility_20d
      - methodology
      title: ForecastEstimate
    ForkCreate:
      properties:
        included_market_ids:
          items:
            type: string
          type: array
          title: Included Market Ids
      type: object
      required:
      - included_market_ids
      title: ForkCreate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Investigation:
      properties:
        id:
          type: string
          title: Id
        query:
          type: string
          maxLength: 500
          minLength: 4
          title: Query
        refresh_policy:
          $ref: '#/components/schemas/RefreshPolicy'
          default: manual
        deep_mode:
          type: boolean
          title: Deep Mode
          default: false
        mode:
          $ref: '#/components/schemas/InvestigationMode'
          default: standard
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        latest_run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Run Id
        run_ids:
          items:
            type: string
          type: array
          title: Run Ids
        next_refresh_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Next Refresh At
        archived:
          type: boolean
          title: Archived
          default: false
      type: object
      required:
      - query
      title: Investigation
    InvestigationCreate:
      properties:
        query:
          type: string
          maxLength: 500
          minLength: 4
          title: Query
        refresh_policy:
          $ref: '#/components/schemas/RefreshPolicy'
          default: manual
        deep_mode:
          type: boolean
          title: Deep Mode
          default: false
        mode:
          $ref: '#/components/schemas/InvestigationMode'
          default: standard
      type: object
      required:
      - query
      title: InvestigationCreate
    InvestigationMode:
      type: string
      enum:
      - fast
      - standard
      - deep
      title: InvestigationMode
    InvestigationPatch:
      properties:
        refresh_policy:
          anyOf:
          - $ref: '#/components/schemas/RefreshPolicy'
          - type: 'null'
        deep_mode:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Deep Mode
        archived:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Archived
        mode:
          anyOf:
          - $ref: '#/components/schemas/InvestigationMode'
          - type: 'null'
      type: object
      title: InvestigationPatch
    MarketImpliedAnswer:
      properties:
        conclusion:
          type: string
          title: Conclusion
        label:
          type: string
          title: Label
        probability:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Probability
        market_range:
          anyOf:
          - prefixItems:
            - type: number
            - type: number
            type: array
            maxItems: 2
            minItems: 2
          - type: 'null'
          title: Market Range
        agreement:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Agreement
          default: 0
        coverage:
          $ref: '#/components/schemas/CoverageState'
        takeaways:
          items:
            type: string
          type: array
          maxItems: 3
          title: Takeaways
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
        excluded_market_ids:
          items:
            type: string
          type: array
          title: Excluded Market Ids
        methodology:
          type: string
          title: Methodology
        caveats:
          items:
            type: string
          type: array
          title: Caveats
        as_of:
          type: string
          format: date-time
          title: As Of
        provider_freshness:
          additionalProperties:
            type: string
          type: object
          title: Provider Freshness
        answer_kind:
          $ref: '#/components/schemas/AnswerKind'
          default: market_implied
        verdict:
          anyOf:
          - type: string
          - type: 'null'
          title: Verdict
        confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence
        current_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Current Value
        target_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Target Value
        target_gap:
          anyOf:
          - type: number
          - type: 'null'
          title: Target Gap
        deadline:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deadline
        days_remaining:
          anyOf:
          - type: number
          - type: 'null'
          title: Days Remaining
        forecast:
          anyOf:
          - $ref: '#/components/schemas/ForecastEstimate'
          - type: 'null'
        citations:
          items:
            $ref: '#/components/schemas/SourceCitation'
          type: array
          title: Citations
      type: object
      required:
      - conclusion
      - label
      - coverage
      - methodology
      title: MarketImpliedAnswer
    MarketSnapshot:
      properties:
        id:
          type: string
          title: Id
        question:
          type: string
          title: Question
        slug:
          type: string
          title: Slug
        event_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Id
        event_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Title
        clob_token_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Clob Token Id
        probability:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Probability
        probability_change_24h:
          type: number
          title: Probability Change 24H
          default: 0
        volume_24h:
          type: number
          title: Volume 24H
          default: 0
        volume_total:
          type: number
          title: Volume Total
          default: 0
        liquidity:
          type: number
          title: Liquidity
          default: 0
        open_interest:
          type: number
          title: Open Interest
          default: 0
        best_bid:
          anyOf:
          - type: number
          - type: 'null'
          title: Best Bid
        best_ask:
          anyOf:
          - type: number
          - type: 'null'
          title: Best Ask
        spread:
          anyOf:
          - type: number
          - type: 'null'
          title: Spread
        end_date:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End Date
        resolution_criteria:
          type: string
          title: Resolution Criteria
          default: ''
        resolution_source:
          anyOf:
          - type: string
          - type: 'null'
          title: Resolution Source
        url:
          type: string
          title: Url
        tags:
          items:
            type: string
          type: array
          title: Tags
        retrieval_sources:
          items:
            type: string
          type: array
          title: Retrieval Sources
        relevance:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Relevance
          default: 0
        relation_type:
          $ref: '#/components/schemas/RelationType'
          default: direct
        relation_confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Relation Confidence
          default: 0.5
        relation_reason:
          type: string
          title: Relation Reason
          default: ''
        included:
          type: boolean
          title: Included
          default: true
        quality:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Quality
          default: 0.5
        freshness:
          type: string
          title: Freshness
          default: live
        history:
          items:
            $ref: '#/components/schemas/PricePoint'
          type: array
          title: History
      type: object
      required:
      - id
      - question
      - slug
      - probability
      - url
      title: MarketSnapshot
    PricePoint:
      properties:
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        probability:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Probability
      type: object
      required:
      - timestamp
      - probability
      title: PricePoint
    QueryIntent:
      properties:
        proposition:
          type: string
          title: Proposition
        entities:
          items:
            type: string
          type: array
          title: Entities
        geography:
          anyOf:
          - type: string
          - type: 'null'
          title: Geography
        horizon:
          anyOf:
          - type: string
          - type: 'null'
          title: Horizon
        target_year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Target Year
        outcome:
          type: string
          title: Outcome
          default: 'yes'
        ambiguous:
          type: boolean
          title: Ambiguous
          default: false
        asset:
          anyOf:
          - type: string
          - type: 'null'
          title: Asset
        symbol:
          anyOf:
          - type: string
          - type: 'null'
          title: Symbol
        target_value:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Target Value
        currency:
          type: string
          title: Currency
          default: USD
        target_condition:
          anyOf:
          - $ref: '#/components/schemas/TargetCondition'
          - type: 'null'
        deadline:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deadline
        timezone:
          type: string
          title: Timezone
          default: Asia/Shanghai
        requested_answer_type:
          anyOf:
          - $ref: '#/components/schemas/AnswerKind'
          - type: 'null'
      type: object
      required:
      - proposition
      title: QueryIntent
    RefreshPolicy:
      type: string
      enum:
      - manual
      - daily
      title: RefreshPolicy
    RelationType:
      type: string
      enum:
      - direct
      - duplicate
      - complement
      - supporting_proxy
      - conflicting_proxy
      - measured_correlation
      - external_context
      title: RelationType
    RelationshipEdge:
      properties:
        id:
          type: string
          title: Id
        source_id:
          type: string
          title: Source Id
        target_id:
          type: string
          title: Target Id
        relation_type:
          $ref: '#/components/schemas/RelationType'
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        explanation:
          type: string
          title: Explanation
        measured_correlation:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: -1.0
          - type: 'null'
          title: Measured Correlation
        observation_count:
          anyOf:
          - type: integer
          - type: 'null'
