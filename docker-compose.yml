name: ${COMPOSE_PROJECT_NAME:-polytrend-v3}
services:
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      INTERNAL_API_URL: http://api:8000
    ports: ['${WEB_PORT:-3000}:3000']
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infra/docker/research.Dockerfile
    environment: &research
      DATABASE_URL: postgresql://polytrend:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-polytrend}
      POLYTREND_LIVE_MARKET_DATA: ${POLYTREND_LIVE_MARKET_DATA:-true}
      POLYMARKET_GAMMA_URL: ${POLYMARKET_GAMMA_URL:-https://gamma-api.polymarket.com}
      POLYMARKET_CLOB_URL: ${POLYMARKET_CLOB_URL:-https://clob.polymarket.com}
      POLYMARKET_DATA_URL: ${POLYMARKET_DATA_URL:-https://data-api.polymarket.com/v2}
      MARKET_CAPTURE_ENABLED: ${MARKET_CAPTURE_ENABLED:-false}
      MARKET_SYNC_INTERVAL_SECONDS: ${MARKET_SYNC_INTERVAL_SECONDS:-300}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
    ports: ['127.0.0.1:${API_PORT:-8000}:8000']
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
  worker:
    profiles: ['worker']
    build:
      context: .
      dockerfile: infra/docker/research.Dockerfile
    command: ['python', '-m', 'polytrend.worker']
    environment: *research
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polytrend}
      POSTGRES_USER: polytrend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ['postgres_data:/var/lib/postgresql/data']
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U polytrend -d ${POSTGRES_DB:-polytrend}']
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
